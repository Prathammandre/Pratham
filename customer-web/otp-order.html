<!DOCTYPE html>
<html>
<head>
    <title>Order at Restaurant</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Place Order at Restaurant</h1>
    <form id="otpOrderForm">
        <label>Restaurant ID:</label>
        <input type="text" id="restaurantId" required><br>
        <label>OTP Code:</label>
        <input type="text" id="otpCode" required><br>
        <label>Order Details:</label>
        <textarea id="orderDetails" required></textarea><br>
        <button type="submit">Place Order</button>
    </form>
    <script src="js/otp.js"></script>
</body>
</html>
