<!DOCTYPE html>
<html>
<head>
    <title>Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Book a Table</h1>
    <form id="bookingForm">
        <label>Restaurant ID:</label>
        <input type="text" id="restaurantId" required><br>
        <label>Booking Time:</label>
        <input type="datetime-local" id="bookingTime" required><br>
        <button type="submit">Book</button>
    </form>
    <script src="js/booking.js"></script>
</body>
</html>
