<html>
<head>
    <title>Add Restaurant Details</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Add Restaurant Details</h1>
    <form id="restaurantForm">
        <label>Restaurant Name:</label>
        <input type="text" id="name" required><br>
        <label>Number of Tables:</label>
        <input type="number" id="tables" required><br>
        <label>Number of Chairs:</label>
        <input type="number" id="chairs" required><br>
        <label>Interior Image URL:</label>
        <input type="text" id="image" required><br>
        <label>Menu Items (JSON Format):</label>
        <textarea id="menu" required></textarea><br>
        <button type="submit">Save</button>
    </form>
    <script src="js/restaurant.js"></script>
</body>
</html>
